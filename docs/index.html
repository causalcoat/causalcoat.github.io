<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover and measure useful factors in unstructured data, then study causal structure and intervention effects with coatlearn.">
  <title>coatlearn documentation</title>
  <meta name="theme-color" content="#f7f7f2">
  <link rel="stylesheet" href="assets/vendor/docsify-vue.css">
  <link rel="stylesheet" href="assets/docs.css">
</head>
<body>
  <div id="app">Loading coatlearn documentation…</div>
  <script>
    window.$docsify = {
      name: 'COAT-Learn',
      search: {
        paths: 'auto',
        namespace: 'coatlearn-docs-v2',
        pathNamespaces: ['/zh-cn'],
        maxAge: 86400000,
        depth: 3,
        hideOtherSidebarContent: true,
        placeholder: {'/zh-cn/': '搜索中文文档…', '/': 'Search English docs…'},
        noData: {'/zh-cn/': '没有找到结果。试试更短的词语或函数名。', '/': 'No results. Try a shorter term or a function name.'}
      },
      copyCode: {
        buttonText: {'/zh-cn/': '复制', '/': 'Copy'},
        successText: {'/zh-cn/': '已复制', '/': 'Copied'},
        errorText: {'/zh-cn/': '请手动复制', '/': 'Select and copy'}
      },
      pagination: {
        previousText: {'/zh-cn/': '上一篇', '/': 'Previous'},
        nextText: {'/zh-cn/': '下一篇', '/': 'Next'},
        crossChapter: true,
        crossChapterText: false
      },
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      relativePath: true,
      auto2top: true,
      subMaxLevel: 2,
      mergeNavbar: true,
      nameLink: {'/zh-cn/': '#/zh-cn/', '/': '#/'},
      noCompileLinks: ['\\.toml$', '\\.csv$', '\\.sh$'],
      markdown: {
        renderer: {
          link: function (href, title, text) {
            var current = window.location.hash.slice(1).split('?')[0] || '/';
            if (href.startsWith('/')) return this.origin.link.apply(this, arguments);
            var destination = new URL(href, new URL('docs' + current, 'https://local.invalid/'));
            if (destination.origin === 'https://local.invalid' && !destination.pathname.startsWith('/docs/')) {
              var target = destination.pathname.replace(/^\//, '') + destination.hash;
              return '<a href="' + new URL('../' + target, window.location.href.split('#')[0]).href + '" target="_blank" rel="noopener">' + text + '</a>';
            }
            return this.origin.link.apply(this, arguments);
          }
        }
      },
      alias: {
        '/zh-cn/.*_sidebar.md': '/zh-cn/_sidebar.md',
        '/zh-cn/.*_navbar.md': '/zh-cn/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      plugins: [function (hook, vm) {
        hook.doneEach(function () {
          document.documentElement.lang = vm.route.path.startsWith('/zh-cn/') ? 'zh-CN' : 'en';
        });
      }]
    };
  </script>
  <script src="assets/docs.js"></script>
  <script src="assets/vendor/docsify.min.js"></script>
  <script src="assets/vendor/docsify-search.min.js"></script>
  <script src="assets/vendor/docsify-copy-code.min.js"></script>
  <script src="assets/vendor/docsify-pagination.min.js"></script>
  <script src="assets/vendor/prism-python.min.js"></script>
  <script src="assets/vendor/prism-bash.min.js"></script>
  <script src="assets/vendor/prism-toml.min.js"></script>
</body>
</html>
